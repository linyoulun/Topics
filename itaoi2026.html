<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ant Simulation Dashboard</title>

  <style>
    
      body {
      margin: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #05070f;
      color: #e2e8f0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #app { display: flex; width: 100%; height: 100%; }
    .sidebar {
      width: 320px; background-color: #0b0d17; padding: 25px;
      display: flex; flex-direction: column; gap: 18px; overflow-y: auto;
      border-right: 1px solid #1e293b; box-shadow: 5px 0 15px rgba(0,0,0,0.8);
    }
    h2 { margin-top: 0; color: #00f0ff; font-size: 18px; border-bottom: 2px solid #00f0ff; padding-bottom: 10px; font-weight: bold; }
    hr { border: 0; border-top: 1px solid #1e293b; margin: 5px 0; }
    .param-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 12px; color: #94a3b8; font-weight: 600; }
    input[type="number"], select {
      background: #1e293b; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 6px; font-weight: 500;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
    }
    .range-readout {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: #cbd5e1;
      font-size: 12px;
    }
    .range-readout b {
      color: #f8fafc;
      font-size: 16px;
      line-height: 1;
    }
    .timeline-controls {
      display: grid;
      grid-template-columns: 1fr 0.85fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }
    .timeline-controls button {
      padding: 9px 8px;
      border-radius: 6px;
      font-size: 12px;
      box-shadow: none;
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
    }
    .timeline-controls button:hover {
      border-color: #38bdf8;
      color: #ffffff;
    }
    textarea {
      background: #0f172a; border: 1px solid #334155; color: #e2e8f0; padding: 10px; border-radius: 6px;
      min-height: 160px; resize: vertical; font-size: 12px; line-height: 1.35; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    button {
      background: linear-gradient(135deg, #00f0ff 0%, #0072ff 100%); color: #fff; border: none; padding: 14px;
      border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(0, 240, 255, 0.3);
    }
    button:hover { filter: brightness(1.1); }
    button:disabled {
      cursor: wait;
      opacity: 0.62;
      filter: grayscale(0.25);
      box-shadow: none;
    }
    .simulation-status {
      display: none;
      padding: 10px 12px;
      border: 1px solid rgba(56, 189, 248, 0.32);
      border-radius: 6px;
      background: rgba(8, 13, 24, 0.88);
      color: #bfdbfe;
      font-size: 12px;
      line-height: 1.45;
    }
    .simulation-status.active {
      display: block;
    }
    .hud-panel { background-color: #05060b; border: 1px solid #1e293b; padding: 15px; border-radius: 8px; margin-top: auto; }
    .status-item { margin: 10px 0; font-size: 13px; display: flex; align-items: center; color: #cbd5e1; }
    .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; display: inline-block; }
    .text-blue { background-color: #00b0ff; box-shadow: 0 0 8px #00b0ff; }
    .text-orange { background-color: #ff9100; box-shadow: 0 0 8px #ff9100; }
    .text-green { background-color: #00e676; box-shadow: 0 0 8px #00e676; }

    .main-content {
      flex: 1; background-color: #020305; padding: 20px;
      display: flex; align-items: center; justify-content: center; overflow: auto;
    }
    #canvasContainer {
      position: relative;
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background-color: #000; border-radius: 6px; border: 1px solid #1e293b;
      overflow: hidden; /* no scroll, just scale */
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .flow-dashboard {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 8px;
      background: rgba(5, 7, 15, 0.86);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.32);
      color: #dbeafe;
      pointer-events: auto;
    }
    .flow-dashboard h3 {
      margin: 0 0 10px;
      color: #f8fafc;
      font-size: 13px;
      letter-spacing: 0;
    }
    .flow-section {
      padding-top: 10px;
      margin-top: 10px;
      border-top: 1px solid rgba(148, 163, 184, 0.16);
    }
    .flow-section:first-of-type {
      padding-top: 0;
      margin-top: 0;
      border-top: 0;
    }
    .flow-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin: 7px 0;
      font-size: 12px;
      color: #cbd5e1;
    }
    .flow-row label {
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 600;
    }
    .flow-dashboard select {
      width: 136px;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
    }
    .flow-dashboard input[type="range"] {
      width: 136px;
      accent-color: #38bdf8;
    }
    .flow-dashboard input[type="checkbox"] {
      accent-color: #38bdf8;
    }
    .flow-legend {
      display: grid;
      grid-template-columns: 42px 1fr;
      align-items: center;
      gap: 6px 10px;
      margin-top: 8px;
      font-size: 11px;
      color: #cbd5e1;
    }
    .legend-line {
      height: 4px;
      border-radius: 999px;
    }
    .legend-line.low {
      opacity: 0.92;
      background: linear-gradient(90deg, rgba(20, 84, 255, 0.35), rgba(0, 224, 255, 0.7));
    }
    .legend-line.mid {
      height: 6px;
      opacity: 1;
      background: linear-gradient(90deg, rgba(255, 232, 38, 0.72), rgba(255, 126, 24, 0.88));
    }
    .legend-line.peak {
      height: 8px;
      opacity: 1;
      background: linear-gradient(90deg, #ff7e18, #ff2018, #fff7ed);
      box-shadow: 0 0 12px rgba(255, 48, 24, 0.9);
    }
    .flow-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .flow-stat {
      min-width: 0;
      padding: 8px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.58);
    }
    .flow-stat span {
      display: block;
      color: #94a3b8;
      font-size: 10px;
      line-height: 1.2;
    }
    .flow-stat b {
      display: block;
      margin-top: 3px;
      color: #f8fafc;
      font-size: 15px;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .distribution-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 8px;
    }
    .distribution-row {
      display: grid;
      grid-template-columns: 70px 1fr 58px;
      align-items: center;
      gap: 7px;
      color: #cbd5e1;
      font-size: 11px;
    }
    .distribution-row span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .distribution-bar {
      height: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.18);
    }
    .distribution-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #38bdf8, #22c55e);
    }
    .distribution-row.algorithm .distribution-fill {
      background: linear-gradient(90deg, #f97316, #ec4899);
    }
    .flow-tooltip {
      position: absolute;
      z-index: 6;
      min-width: 190px;
      max-width: 240px;
      padding: 10px 11px;
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 8px;
      background: rgba(2, 6, 23, 0.92);
      color: #e2e8f0;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.42);
      font-size: 12px;
      line-height: 1.45;
      pointer-events: none;
      display: none;
    }
    .flow-tooltip strong {
      display: block;
      margin-bottom: 4px;
      color: #ffffff;
      font-size: 13px;
    }
    .flow-tooltip .muted {
      color: #94a3b8;
    }
  
  </style>

  <script>
        const CELL_SIZE = 50;
    const HEADER_HEIGHT = 40;
    const MAX_ANTS_PER_PIXEL = 3;
    const ANT_COUNT_BASE = 735;
    const ANT_COUNT_MAX = ANT_COUNT_BASE * 4;
    const LOCAL_SIMULATION_LIMIT = 240;
    const LOCAL_SERVER_URL = 'http://127.0.0.1:8787';

    
    const ALGO_COLORS = [
      '#0078D7', // 0: BFS (Blue)
      '#FF8C00', // 1: DFS (Orange)
      '#32CD32', // 2: Tremaux (Green)
      '#008080', // 3: AStar (Teal)
      '#8B4513', // 4: Dijkstra (Brown)
      '#9400D3', // 5: GreedyBFS (Purple)
      '#FF1493'  // 6: RandomWalk (Pink)
    ];
    const ALGO_NAMES = ['BFS', 'DFS', 'Tremaux', 'AStar', 'Dijkstra', 'GreedyBFS', 'RandomWalk'];
    const PERSONALITY_NAMES = ['Careful', 'Opportunist', 'Random'];

    const TECH_THEME = {
      wall: '#323232',
      floor: '#f0f0f0',
      start: '#00c800',
      end: '#c80000',
      ant: '#ffa500',
      multi: '#1e1e1e',
      text: '#000000',
      grid: '#c8c8c8',
      header: '#ffffff',
      headerLine: 'rgba(0, 0, 0, 0.12)'
    };

    const TRAFFIC_THEME = {
      wall: '#030507',
      floor: '#151a20',
      start: '#3dff8f',
      end: '#ff4d4d',
      ant: '#fff7ed',
      multi: '#ffffff',
      text: '#dbeafe',
      grid: 'rgba(148, 163, 184, 0.16)',
      header: '#070b10',
      headerLine: 'rgba(56, 189, 248, 0.32)'
    };

    function parseCsvMap(text) {
      const rows = [];
      let maxCols = 0;
      const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
      for (const line of lines) {
        if (!line.trim()) continue;
        const row = line.split(',').map((cell) => {
          const cleaned = String(cell).trim();
          return cleaned === '' ? '#' : cleaned;
        });
        maxCols = Math.max(maxCols, row.length);
        rows.push(row);
      }
      for (const row of rows) {
        while (row.length < maxCols) row.push('#');
      }
      return rows;
    }

    // ==========================================
    // 2. 尋路與量子隊列防死結核心
    // ==========================================
    function isWalkable(cell) {
      if (cell === undefined || cell === null) return false;
      const value = String(cell).trim();
      if (value === '.' || value === 'S' || value === 'E') return true;
      if (!isNaN(parseInt(value))) return true;
      return false;
    }

    function getNeighbors(r, c, maze) {
      const neighbors = [];
      const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (let [dr, dc] of dirs) {
        let nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < maze.length && nc >= 0 && nc < maze[0].length && isWalkable(maze[nr][nc])) {
          neighbors.push([nr, nc]);
        }
      }
      return neighbors;
    }

    function solveBFS(maze, start, end) {
      let queue = [start];
      let visited = new Set([start.toString()]);
      let parent = {};
      parent[start.toString()] = null;

      while (queue.length > 0) {
        let curr = queue.shift();
        if (curr[0] === end[0] && curr[1] === end[1]) {
          let path = [];
          let step = curr;
          while (step) { path.push(step); step = parent[step.toString()]; }
          return path.reverse();
        }
        for (let neighbor of getNeighbors(curr[0], curr[1], maze)) {
          if (!visited.has(neighbor.toString())) {
            visited.add(neighbor.toString());
            parent[neighbor.toString()] = curr;
            queue.push(neighbor);
          }
        }
      }
      return [];
    }

function solveDFS(maze, start, end) {
      let stack = [start];
      let visited = new Set([start.toString()]);
      let parent = {};
      parent[start.toString()] = null;

      while (stack.length > 0) {
        let curr = stack.pop();
        if (curr[0] === end[0] && curr[1] === end[1]) {
          let path = [];
          let step = curr;
          while (step) { path.push(step); step = parent[step.toString()]; }
          return path.reverse();
        }
        let neighbors = getNeighbors(curr[0], curr[1], maze);
        neighbors.sort(() => Math.random() - 0.5);
        for (let neighbor of neighbors) {
          if (!visited.has(neighbor.toString())) {
            visited.add(neighbor.toString());
            parent[neighbor.toString()] = curr;
            stack.push(neighbor);
          }
        }
      }
      return [];
    }

    function heuristic(a, b) {
      return Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]);
    }

    function solveTremaux(maze, start, end) {
      let curr = start;
      let path = [start];
      let visitedEdges = {};
      let searchSteps = 0;
      let maxSteps = maze.length * maze[0].length * 2;
      
      while ((curr[0] !== end[0] || curr[1] !== end[1]) && searchSteps < maxSteps) {
        searchSteps++;
        let neighbors = getNeighbors(curr[0], curr[1], maze);
        let validNeighbors = [];
        
        for (let n of neighbors) {
          let edgeKey = [curr.toString(), n.toString()].sort().join('-');
          if ((visitedEdges[edgeKey] || 0) < 2) {
            validNeighbors.push(n);
          }
        }
        
        if (validNeighbors.length === 0) break;
        let nextNode = validNeighbors[Math.floor(Math.random() * validNeighbors.length)];
        let edgeKey = [curr.toString(), nextNode.toString()].sort().join('-');
        visitedEdges[edgeKey] = (visitedEdges[edgeKey] || 0) + 1;
        
        curr = nextNode;
        path.push(curr);
      }
      return path;
    }

    function solveAStar(maze, start, end) {
      let pq = [{cost: heuristic(start, end), steps: 0, curr: start, path: [start]}];
      let visited = {};
      visited[start.toString()] = 0;
      
      while (pq.length > 0) {
        pq.sort((a, b) => a.cost - b.cost);
        let node = pq.shift();
        
        if (node.curr[0] === end[0] && node.curr[1] === end[1]) return node.path;
        
        let neighbors = getNeighbors(node.curr[0], node.curr[1], maze);
        for (let n of neighbors) {
          let newSteps = node.steps + 1;
          if (visited[n.toString()] === undefined || newSteps < visited[n.toString()]) {
            visited[n.toString()] = newSteps;
            let h = heuristic(n, end);
            pq.push({
              cost: newSteps + h,
              steps: newSteps,
              curr: n,
              path: node.path.concat([n])
            });
          }
        }
      }
      return [];
    }

    function solveDijkstra(maze, start, end) {
      let pq = [{dist: 0, curr: start, path: [start]}];
      let visited = {};
      visited[start.toString()] = 0;
      
      while (pq.length > 0) {
        pq.sort((a, b) => a.dist - b.dist);
        let node = pq.shift();
        
        if (node.curr[0] === end[0] && node.curr[1] === end[1]) return node.path;
        
        let neighbors = getNeighbors(node.curr[0], node.curr[1], maze);
        for (let n of neighbors) {
          let newDist = node.dist + 1;
          if (visited[n.toString()] === undefined || newDist < visited[n.toString()]) {
            visited[n.toString()] = newDist;
            pq.push({
              dist: newDist,
              curr: n,
              path: node.path.concat([n])
            });
          }
        }
      }
      return [];
    }

    function solveGreedyBFS(maze, start, end) {
      let curr = start;
      let path = [start];
      let visited = new Set([start.toString()]);
      let searchSteps = 0;
      let maxSteps = maze.length * maze[0].length;
      
      while ((curr[0] !== end[0] || curr[1] !== end[1]) && searchSteps < maxSteps) {
        searchSteps++;
        let neighbors = getNeighbors(curr[0], curr[1], maze);
        let bestNode = null;
        let minH = Infinity;
        
        for (let n of neighbors) {
          if (!visited.has(n.toString())) {
            let h = heuristic(n, end);
            if (h < minH) {
              minH = h;
              bestNode = n;
            }
          }
        }
        
        if (bestNode) {
          curr = bestNode;
          visited.add(curr.toString());
          path.push(curr);
        } else {
          break;
        }
      }
      return path;
    }

    function solveRandomWalk(maze, start, target) {
      let path = [start];
      let curr = start;
      let visitedCount = {};
      visitedCount[start.toString()] = 1;
      let maxSteps = 1000;
      let step = 0;
      
      while (step < maxSteps) {
        if (curr[0] === target[0] && curr[1] === target[1]) {
          break;
        }
        let neighbors = getNeighbors(curr[0], curr[1], maze);
        if (neighbors.length === 0) break;
        
        let nextNode = null;
        if (Math.random() < 0.2) {
          // 20% bias to move towards the target
          let bestDist = Infinity;
          for (let n of neighbors) {
            let dist = Math.abs(n[0] - target[0]) + Math.abs(n[1] - target[1]);
            if (dist < bestDist) {
              bestDist = dist;
              nextNode = n;
            }
          }
        } else {
          // 80% chance to explore, preferring less visited nodes
          let minCount = Infinity;
          for (let n of neighbors) {
            let c = visitedCount[n.toString()] || 0;
            if (c < minCount) { minCount = c; }
          }
          let candidates = neighbors.filter(n => (visitedCount[n.toString()] || 0) === minCount);
          nextNode = candidates[Math.floor(Math.random() * candidates.length)];
        }
        
        path.push(nextNode);
        visitedCount[nextNode.toString()] = (visitedCount[nextNode.toString()] || 0) + 1;
        curr = nextNode;
        step++;
      }
      return path;
    }

    // ==========================================
    // 3. Canvas 繪圖引擎與環狀進度儀表板
    // ==========================================
    class Simulator {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.maze = null;
        this.cellSize = CELL_SIZE;
        this.headerHeight = HEADER_HEIGHT;
        this.micePaths = [];
        this.miceAlgos = [];
        this.micePersonalities = [];
        this.miceDelays = [];
        this.maxSteps = 0;
        this.currentStep = 0;
        this.isPlaying = false;
        this.animationId = null;
        this.lastFrameTime = 0;
        this.cameras = [];
        this.flowStatsCache = null;
        this.baseMapCanvas = {};
        this.flowLayerCache = null;
        this.flowLayerKey = '';
        this.coverageRateCache = null;
        this.statsPanelKey = '';
      }

      initSimulation(mouseCount, spawnInterval, maxCameras) {
        if (!this.maze) return;
        this.currentStep = 0;
        this.micePaths = [];
        this.miceAlgos = [];
        this.micePersonalities = [];
        this.miceDelays = [];
        this.maxSteps = 0;
        this.flowStatsCache = null;
        this.baseMapCanvas = {};
        this.flowLayerCache = null;
        this.flowLayerKey = '';
        this.coverageRateCache = null;
        this.statsPanelKey = '';
        this.cellSize = CELL_SIZE;
        this.headerHeight = HEADER_HEIGHT;

        let starts = [], ends = [], exhibits = [];
        for (let r = 0; r < this.maze.length; r++) {
          for (let c = 0; c < this.maze[0].length; c++) {
            let cell = this.maze[r][c];
            if (cell === 'S') starts.push([r, c]);
            else if (cell === 'E') ends.push([r, c]);
            else if (cell === '1' || cell === '2') exhibits.push([r, c]);
          }
        }

        // 尋路軌跡分配
        let rawPaths = [];
        let rawAlgos = [];
        for (let i = 0; i < mouseCount; i++) {
          let start = starts[Math.floor(Math.random() * Math.max(1, starts.length))];
          let end = ends[Math.floor(Math.random() * Math.max(1, ends.length))];
          
          let personality = PERSONALITY_NAMES[Math.floor(Math.random() * PERSONALITY_NAMES.length)];
          let targets = [];
          
          if (personality === "Careful") {
            let sortedEx = [...exhibits].sort((a, b) => {
              let valA = parseInt(this.maze[a[0]][a[1]]) || 999;
              let valB = parseInt(this.maze[b[0]][b[1]]) || 999;
              return valA - valB;
            });
            targets = sortedEx.concat([end]);
          } else if (personality === "Opportunist") {
            let remaining = [...exhibits];
            let curr = start;
            while(remaining.length > 0) {
              let bestIdx = 0;
              let bestDist = Infinity;
              for(let j=0; j<remaining.length; j++) {
                let d = Math.abs(curr[0]-remaining[j][0]) + Math.abs(curr[1]-remaining[j][1]);
                if (d < bestDist) { bestDist = d; bestIdx = j; }
              }
              let nextTarget = remaining.splice(bestIdx, 1)[0];
              targets.push(nextTarget);
              curr = nextTarget;
            }
            targets.push(end);
          } else {
            let remaining = [...exhibits];
            let curr = start;
            while(remaining.length > 0) {
              remaining.sort((a, b) => {
                let dA = Math.abs(curr[0]-a[0]) + Math.abs(curr[1]-a[1]);
                let dB = Math.abs(curr[0]-b[0]) + Math.abs(curr[1]-b[1]);
                return dA - dB;
              });
              let candidates = remaining.slice(0, 3);
              let nextTarget = candidates[Math.floor(Math.random() * candidates.length)];
              targets.push(nextTarget);
              remaining = remaining.filter(ex => ex[0] !== nextTarget[0] || ex[1] !== nextTarget[1]);
              curr = nextTarget;
            }
            targets.push(end);
          }
          
          
          let algos = [solveBFS, solveDFS, solveTremaux, solveAStar, solveDijkstra, solveGreedyBFS, solveRandomWalk];
          let algoChoice = Math.floor(Math.random() * algos.length);
          rawAlgos.push(algoChoice);
          this.micePersonalities.push(personality);
          let fullPath = [start];
          let currPos = start;
          
          for (let target of targets) {
            if (!target) continue;
            let subPath = algos[algoChoice](this.maze, currPos, target);
if (subPath && subPath.length > 0) {
              if (subPath[0][0] === currPos[0] && subPath[0][1] === currPos[1]) {
                fullPath = fullPath.concat(subPath.slice(1));
              } else {
                fullPath = fullPath.concat(subPath);
              }
            }
            currPos = target;
          }
          
          rawPaths.push(fullPath.length > 1 ? fullPath : [start, end]);
        }

        // CSMA/CD 佇列進場延遲計算
        for (let i = 0; i < mouseCount; i++) {
          this.micePaths.push(rawPaths[i]);
          this.miceAlgos.push(rawAlgos[i]);
          let delay = i * spawnInterval + 15;
          this.miceDelays.push(delay);
          let totalLen = delay + rawPaths[i].length;
          if (totalLen > this.maxSteps) this.maxSteps = totalLen;
        }
        // 加入緩衝時間，等最後一隻螞蟻抵達後 50 個 step 再重新開始
        this.maxSteps += 50;


        this.calculateCameraPlacement(maxCameras);
        this.canvas.width = this.maze[0].length * this.cellSize;
        this.canvas.height = this.maze.length * this.cellSize + this.headerHeight;
      }

      reviveFlowStats(stats) {
        if (!stats) return null;
        const edgeStats = stats.edgeStats || [];
        const cellEdges = new Map();
        edgeStats.forEach((edge) => {
          [`${edge.r1},${edge.c1}`, `${edge.r2},${edge.c2}`].forEach((cellKey) => {
            if (!cellEdges.has(cellKey)) cellEdges.set(cellKey, []);
            cellEdges.get(cellKey).push(edge);
          });
        });
        return { ...stats, edgeStats, cellEdges };
      }

      loadSimulationPayload(payload) {
        this.stop();
        this.currentStep = 0;
        this.maze = payload.maze;
        this.cellSize = payload.cellSize || CELL_SIZE;
        this.headerHeight = payload.headerHeight || HEADER_HEIGHT;
        this.micePaths = payload.micePaths || [];
        this.miceAlgos = payload.miceAlgos || [];
        this.micePersonalities = payload.micePersonalities || [];
        this.miceDelays = payload.miceDelays || [];
        this.maxSteps = payload.maxSteps || 0;
        this.cameras = payload.cameras || [];
        this.flowStatsCache = this.reviveFlowStats(payload.flowStats);
        this.baseMapCanvas = {};
        this.flowLayerCache = null;
        this.flowLayerKey = '';
        this.coverageRateCache = null;
        this.statsPanelKey = '';
        this.canvas.width = this.maze[0].length * this.cellSize;
        this.canvas.height = this.maze.length * this.cellSize + this.headerHeight;
      }

      calculateCameraPlacement(maxCameras) {
        this.cameras = [];
        let heatMap = Array(this.maze.length).fill(0).map(() => Array(this.maze[0].length).fill(0));
        this.micePaths.forEach(path => path.forEach(([r, c]) => { heatMap[r][c]++; }));

        let wallCandidates = [];
        for (let r = 0; r < this.maze.length; r++) {
          for (let c = 0; c < this.maze[0].length; c++) {
            if (!isWalkable(this.maze[r][c])) wallCandidates.push([r, c]);
          }
        }

        let step = Math.max(1, Math.floor(wallCandidates.length / 800));
        for (let k = 0; k < maxCameras; k++) {
          let bestScore = -1, bestCam = null;
          for (let i = 0; i < wallCandidates.length; i += step) {
            let [wr, wc] = wallCandidates[i];
            if (this.cameras.some(c => c.r === wr && c.c === wc)) continue;
            
            let score = 0;
            for (let dr = -5; dr <= 5; dr++) {
              for (let dc = -5; dc <= 5; dc++) {
                let nr = wr + dr, nc = wc + dc;
                if (nr >= 0 && nr < this.maze.length && nc >= 0 && nc < this.maze[0].length) {
                  if (isWalkable(this.maze[nr][nc])) score += heatMap[nr][nc];
                }
              }
            }
            if (score > bestScore) {
              bestScore = score;
              bestCam = { r: wr, c: wc, radius: this.cellSize * 12, angle: Math.random() * Math.PI * 2 };
            }
          }
          if (bestCam && bestScore > 0) this.cameras.push(bestCam);
        }
      }

      // 完美重置：繪製右上角高精準環狀進度儀表板
      drawHUDProgressRing(cx, cy, radius, thickness, value, total, startColor, endColor, label) {
        // 1. 繪製底部灰色槽
        this.ctx.beginPath();
        this.ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        this.ctx.strokeStyle = 'rgba(148, 163, 184, 0.28)';
        this.ctx.lineWidth = thickness;
        this.ctx.stroke();

        // 2. 繪製漸層彩色進度弧線
        if (total > 0 && value > 0) {
          let percentage = value / total;
          this.ctx.beginPath();
          this.ctx.arc(cx, cy, radius, -Math.PI / 2, (-Math.PI / 2) + (Math.PI * 2 * percentage));
          this.ctx.strokeStyle = startColor;
          this.ctx.lineWidth = thickness;
          this.ctx.stroke();
        }

        // 3. 填入精緻數值與標籤文字 (對齊 Python 格式)
        this.ctx.fillStyle = '#dbeafe';
        this.ctx.font = 'bold 11px Arial';
        this.ctx.textAlign = 'left';
        this.ctx.textBaseline = 'middle';
        let valStr = String(value).padStart(3, '0');
        this.ctx.fillText(`${label} ${valStr}`, cx + radius + 8, cy);
      }

      buildFullHeatMap() {
        if (this.flowStatsCache) return this.flowStatsCache;
        const heatMap = Array(this.maze.length).fill(0).map(() => Array(this.maze[0].length).fill(0));
        const algoMap = Array(this.maze.length).fill(0).map(() => Array(this.maze[0].length).fill(0).map(() => Array(ALGO_COLORS.length).fill(0)));
        const personalityMap = Array(this.maze.length).fill(0).map(() => Array(this.maze[0].length).fill(0).map(() => Array(PERSONALITY_NAMES.length).fill(0)));
        const algoCounts = Array(ALGO_NAMES.length).fill(0);
        const personalityCounts = Array(PERSONALITY_NAMES.length).fill(0);
        const edgeMap = new Map();
        const cellEdges = new Map();
        let maxHeat = 0;
        let maxEdgeFlow = 0;
        let totalVisits = 0;
        let totalEdgeFlow = 0;
        this.micePaths.forEach((path, pathIndex) => {
          const algoIndex = this.miceAlgos[pathIndex] ?? 0;
          const personalityIndex = Math.max(0, PERSONALITY_NAMES.indexOf(this.micePersonalities[pathIndex] || PERSONALITY_NAMES[0]));
          algoCounts[algoIndex]++;
          personalityCounts[personalityIndex]++;
          path.forEach(([r, c]) => {
            if (r < 0 || r >= this.maze.length || c < 0 || c >= this.maze[0].length) return;
            heatMap[r][c]++;
            algoMap[r][c][algoIndex]++;
            personalityMap[r][c][personalityIndex]++;
            totalVisits++;
            if (heatMap[r][c] > maxHeat) maxHeat = heatMap[r][c];
          });
          for (let step = 1; step < path.length; step++) {
            const [fromR, fromC] = path[step - 1];
            const [toR, toC] = path[step];
            if (
              fromR < 0 || fromR >= this.maze.length ||
              fromC < 0 || fromC >= this.maze[0].length ||
              toR < 0 || toR >= this.maze.length ||
              toC < 0 || toC >= this.maze[0].length
            ) continue;
            if (!isWalkable(this.maze[fromR][fromC]) || !isWalkable(this.maze[toR][toC])) continue;
            const isNeighbor = Math.abs(fromR - toR) + Math.abs(fromC - toC) === 1;
            if (!isNeighbor) continue;

            const firstComesBefore = fromR < toR || (fromR === toR && fromC <= toC);
            const r1 = firstComesBefore ? fromR : toR;
            const c1 = firstComesBefore ? fromC : toC;
            const r2 = firstComesBefore ? toR : fromR;
            const c2 = firstComesBefore ? toC : fromC;
            const edgeKey = `${r1},${c1}|${r2},${c2}`;
            let edge = edgeMap.get(edgeKey);
            if (!edge) {
              edge = {
                r1,
                c1,
                r2,
                c2,
                count: 0,
                algoCounts: Array(ALGO_COLORS.length).fill(0),
                personalityCounts: Array(PERSONALITY_NAMES.length).fill(0)
              };
              edgeMap.set(edgeKey, edge);
              [`${r1},${c1}`, `${r2},${c2}`].forEach((cellKey) => {
                if (!cellEdges.has(cellKey)) cellEdges.set(cellKey, []);
                cellEdges.get(cellKey).push(edge);
              });
            }
            edge.count++;
            edge.algoCounts[algoIndex]++;
            edge.personalityCounts[personalityIndex]++;
            totalEdgeFlow++;
            if (edge.count > maxEdgeFlow) maxEdgeFlow = edge.count;
          }
        });
        let hotCells = 0;
        let activeCells = 0;
        for (let r = 0; r < heatMap.length; r++) {
          for (let c = 0; c < heatMap[r].length; c++) {
            if (heatMap[r][c] > 0) {
              activeCells++;
              if (maxHeat > 0 && heatMap[r][c] / maxHeat >= 0.72) hotCells++;
            }
          }
        }
        const edgeStats = Array.from(edgeMap.values());
        this.flowStatsCache = {
          heatMap,
          algoMap,
          personalityMap,
          algoCounts,
          personalityCounts,
          edgeStats,
          cellEdges,
          maxHeat,
          maxEdgeFlow,
          totalVisits,
          totalEdgeFlow,
          hotCells,
          activeCells,
          averageHeat: activeCells ? totalVisits / activeCells : 0
        };
        return this.flowStatsCache;
      }

      getHeatColor(ratio) {
        const clamped = Math.max(0, Math.min(1, ratio));
        const stops = [
          { t: 0.00, r: 20, g: 84, b: 255, a: 0.20 },
          { t: 0.28, r: 0, g: 224, b: 255, a: 0.36 },
          { t: 0.52, r: 255, g: 232, b: 38, a: 0.58 },
          { t: 0.76, r: 255, g: 126, b: 24, a: 0.78 },
          { t: 1.00, r: 255, g: 32, b: 24, a: 0.94 }
        ];
        let left = stops[0];
        let right = stops[stops.length - 1];
        for (let i = 0; i < stops.length - 1; i++) {
          if (clamped >= stops[i].t && clamped <= stops[i + 1].t) {
            left = stops[i];
            right = stops[i + 1];
            break;
          }
        }
        const span = Math.max(0.001, right.t - left.t);
        const mix = (clamped - left.t) / span;
        const red = Math.round(left.r + (right.r - left.r) * mix);
        const green = Math.round(left.g + (right.g - left.g) * mix);
        const blue = Math.round(left.b + (right.b - left.b) * mix);
        const alpha = left.a + (right.a - left.a) * mix;
        return `rgba(${red}, ${green}, ${blue}, ${alpha})`;
      }

      getFlowOptions() {
        return {
          colorMode: document.getElementById('flowColorMode')?.value || 'traffic',
          visualStyle: document.getElementById('flowVisualStyle')?.value || 'lines',
          intensity: (parseInt(document.getElementById('flowIntensity')?.value || '72') / 100),
          thickness: parseInt(document.getElementById('flowThickness')?.value || '4'),
          showTraffic: document.getElementById('showTrafficOverlay')?.checked !== false,
          showCoverage: document.getElementById('showCameraCoverage')?.checked !== false,
          showTooltip: document.getElementById('showFlowTooltip')?.checked !== false
        };
      }

      getDominantAlgo(algoCounts) {
        let bestIndex = 0;
        let bestCount = -1;
        for (let i = 0; i < algoCounts.length; i++) {
          if (algoCounts[i] > bestCount) {
            bestCount = algoCounts[i];
            bestIndex = i;
          }
        }
        return bestIndex;
      }

      normalizeAngle(angle) {
        return Math.atan2(Math.sin(angle), Math.cos(angle));
      }

      isCellCoveredByCameras(r, c) {
        const x = c * this.cellSize + this.cellSize / 2;
        const y = r * this.cellSize + this.cellSize / 2;
        const coveredBy = [];
        this.cameras.forEach((cam, idx) => {
          const cx = cam.c * this.cellSize + this.cellSize / 2;
          const cy = cam.r * this.cellSize + this.cellSize / 2;
          const dx = x - cx;
          const dy = y - cy;
          const distance = Math.sqrt(dx * dx + dy * dy);
          const angle = Math.atan2(dy, dx);
          if (distance <= cam.radius && Math.abs(this.normalizeAngle(angle - cam.angle)) <= 0.6) {
            coveredBy.push(idx + 1);
          }
        });
        return coveredBy;
      }

      getFlowCellColor(r, c, ratio, stats, options) {
        if (options.colorMode === 'algorithm') {
          const algoIndex = this.getDominantAlgo(stats.algoMap[r][c]);
          return this.hexToRgba(ALGO_COLORS[algoIndex], 0.22 + ratio * 0.7 * options.intensity);
        }
        if (options.colorMode === 'coverage') {
          const covered = this.isCellCoveredByCameras(r, c).length > 0;
          if (covered) return `rgba(0, 204, 255, ${0.18 + ratio * 0.58 * options.intensity})`;
          return `rgba(255, 38, 38, ${0.32 + ratio * 0.68 * options.intensity})`;
        }
        const base = this.getHeatColor(ratio).match(/rgba\((\d+), (\d+), (\d+), ([\d.]+)\)/);
        if (!base) return this.getHeatColor(ratio);
        const alpha = Math.min(1, Math.max(0.18, parseFloat(base[4]) * (0.55 + options.intensity * 0.75)));
        return `rgba(${base[1]}, ${base[2]}, ${base[3]}, ${alpha})`;
      }

      isFlowPointCovered(row, col) {
        const x = col * this.cellSize + this.cellSize / 2;
        const y = row * this.cellSize + this.cellSize / 2;
        return this.cameras.some((cam) => {
          const cx = cam.c * this.cellSize + this.cellSize / 2;
          const cy = cam.r * this.cellSize + this.cellSize / 2;
          const dx = x - cx;
          const dy = y - cy;
          const distance = Math.sqrt(dx * dx + dy * dy);
          const angle = Math.atan2(dy, dx);
          return distance <= cam.radius && Math.abs(this.normalizeAngle(angle - cam.angle)) <= 0.6;
        });
      }

      getFlowEdgeColor(edge, ratio, stats, options) {
        if (options.colorMode === 'algorithm') {
          const algoIndex = this.getDominantAlgo(edge.algoCounts);
          return this.hexToRgba(ALGO_COLORS[algoIndex], 0.30 + ratio * 0.68 * options.intensity);
        }
        if (options.colorMode === 'coverage') {
          const covered = this.isFlowPointCovered((edge.r1 + edge.r2) / 2, (edge.c1 + edge.c2) / 2);
          if (covered) return `rgba(0, 224, 255, ${0.24 + ratio * 0.68 * options.intensity})`;
          return `rgba(255, 38, 38, ${0.30 + ratio * 0.68 * options.intensity})`;
        }
        const base = this.getHeatColor(ratio).match(/rgba\((\d+), (\d+), (\d+), ([\d.]+)\)/);
        if (!base) return this.getHeatColor(ratio);
        const alpha = Math.min(1, Math.max(0.20, parseFloat(base[4]) * (0.72 + options.intensity * 0.70)));
        return `rgba(${base[1]}, ${base[2]}, ${base[3]}, ${alpha})`;
      }

      getCellCenter(r, c) {
        return {
          x: c * this.cellSize + this.cellSize / 2,
          y: r * this.cellSize + this.headerHeight + this.cellSize / 2
        };
      }

      drawGridFlowLayer(layerCtx, stats, options) {
        const pad = Math.max(2, this.cellSize * (0.44 - options.thickness * 0.035));
        const size = Math.max(4, this.cellSize - pad * 2);
        for (let r = 0; r < this.maze.length; r++) {
          for (let c = 0; c < this.maze[0].length; c++) {
            const visits = stats.heatMap[r][c];
            if (!visits || !isWalkable(this.maze[r][c])) continue;
            const ratio = visits / stats.maxHeat;
            const x = c * this.cellSize + pad;
            const y = r * this.cellSize + this.headerHeight + pad;

            if (ratio >= 0.72) {
              layerCtx.save();
              layerCtx.shadowColor = options.colorMode === 'coverage' ? '#ff2626' : '#ff3b1f';
              layerCtx.shadowBlur = 18 * options.intensity;
              layerCtx.fillStyle = this.getFlowCellColor(r, c, ratio, stats, options);
              layerCtx.fillRect(x, y, size, size);
              layerCtx.restore();
            } else {
              layerCtx.fillStyle = this.getFlowCellColor(r, c, ratio, stats, options);
              layerCtx.fillRect(x, y, size, size);
            }
          }
        }
      }

      drawLineFlowLayer(layerCtx, stats, options) {
        if (!stats.edgeStats?.length || !stats.maxEdgeFlow) return;
        const flowFloor = stats.edgeStats.length > 5200 ? 0.024 : (stats.edgeStats.length > 2600 ? 0.014 : 0);
        const edges = stats.edgeStats
          .filter((edge) => edge.count / stats.maxEdgeFlow >= flowFloor)
          .sort((a, b) => a.count - b.count);
        const logMax = Math.log1p(stats.maxEdgeFlow);

        layerCtx.save();
        layerCtx.lineCap = 'round';
        layerCtx.lineJoin = 'round';
        edges.forEach((edge) => {
          const ratio = edge.count / stats.maxEdgeFlow;
          const scaled = Math.log1p(edge.count) / logMax;
          const p1 = this.getCellCenter(edge.r1, edge.c1);
          const p2 = this.getCellCenter(edge.r2, edge.c2);
          const color = this.getFlowEdgeColor(edge, ratio, stats, options);
          const lineWidth = Math.max(1, 0.65 + scaled * options.thickness * 2.55);
          const glowWidth = lineWidth * (options.visualStyle === 'bloom' ? 3.2 : 2.2);
          const glowAlpha = Math.min(0.78, 0.18 + scaled * 0.55 * options.intensity);
          const mainAlpha = Math.min(1, 0.32 + scaled * 0.62 * options.intensity);

          if (ratio >= 0.12) {
            layerCtx.save();
            layerCtx.globalCompositeOperation = 'lighter';
            layerCtx.globalAlpha = glowAlpha;
            layerCtx.shadowColor = color;
            layerCtx.shadowBlur = (10 + ratio * 22) * options.intensity;
            layerCtx.strokeStyle = color;
            layerCtx.lineWidth = glowWidth;
            layerCtx.beginPath();
            layerCtx.moveTo(p1.x, p1.y);
            layerCtx.lineTo(p2.x, p2.y);
            layerCtx.stroke();
            layerCtx.restore();
          }

          layerCtx.save();
          layerCtx.globalCompositeOperation = ratio >= 0.08 ? 'lighter' : 'source-over';
          layerCtx.globalAlpha = mainAlpha;
          layerCtx.strokeStyle = color;
          layerCtx.lineWidth = lineWidth;
          layerCtx.beginPath();
          layerCtx.moveTo(p1.x, p1.y);
          layerCtx.lineTo(p2.x, p2.y);
          layerCtx.stroke();
          layerCtx.restore();

          if (ratio >= 0.82) {
            layerCtx.save();
            layerCtx.globalCompositeOperation = 'lighter';
            layerCtx.globalAlpha = 0.52 + ratio * 0.38;
            layerCtx.strokeStyle = 'rgba(255, 255, 255, 0.86)';
            layerCtx.lineWidth = Math.max(1, lineWidth * 0.28);
            layerCtx.beginPath();
            layerCtx.moveTo(p1.x, p1.y);
            layerCtx.lineTo(p2.x, p2.y);
            layerCtx.stroke();
            layerCtx.restore();
          }
        });
        layerCtx.restore();
      }

      drawNodeBloomLayer(layerCtx, stats, options) {
        if (!stats.maxHeat) return;
        const bloomMode = options.visualStyle === 'bloom';
        const threshold = bloomMode ? 0.46 : 0.78;
        const radiusMultiplier = bloomMode ? 5.2 : 3.2;

        layerCtx.save();
        layerCtx.globalCompositeOperation = 'lighter';
        for (let r = 0; r < this.maze.length; r++) {
          for (let c = 0; c < this.maze[0].length; c++) {
            const visits = stats.heatMap[r][c];
            if (!visits || !isWalkable(this.maze[r][c])) continue;
            const ratio = visits / stats.maxHeat;
            if (ratio < threshold) continue;

            const { x, y } = this.getCellCenter(r, c);
            const radius = this.cellSize * (0.8 + ratio * radiusMultiplier) * (0.7 + options.intensity * 0.55);
            const gradient = layerCtx.createRadialGradient(x, y, 0, x, y, radius);
            const alphaBoost = bloomMode ? 1.0 : 0.82;

            if (options.colorMode === 'algorithm') {
              const algoIndex = this.getDominantAlgo(stats.algoMap[r][c]);
              const rgb = this.hexToRgb(ALGO_COLORS[algoIndex]);
              gradient.addColorStop(0.00, `rgba(255, 255, 255, ${0.70 * alphaBoost})`);
              gradient.addColorStop(0.18, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${0.76 * alphaBoost})`);
              gradient.addColorStop(0.58, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${0.22 * alphaBoost})`);
              gradient.addColorStop(1.00, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0)`);
            } else if (options.colorMode === 'coverage') {
              const covered = this.isCellCoveredByCameras(r, c).length > 0;
              const rgb = covered ? { r: 0, g: 224, b: 255 } : { r: 255, g: 38, b: 38 };
              gradient.addColorStop(0.00, `rgba(255, 255, 255, ${0.72 * alphaBoost})`);
              gradient.addColorStop(0.18, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${0.76 * alphaBoost})`);
              gradient.addColorStop(0.62, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${0.20 * alphaBoost})`);
              gradient.addColorStop(1.00, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0)`);
            } else {
              gradient.addColorStop(0.00, `rgba(255, 255, 255, ${0.82 * alphaBoost})`);
              gradient.addColorStop(0.14, `rgba(255, 247, 237, ${0.76 * alphaBoost})`);
              gradient.addColorStop(0.34, `rgba(255, 126, 24, ${0.56 * alphaBoost})`);
              gradient.addColorStop(0.70, `rgba(255, 32, 24, ${0.20 * alphaBoost})`);
              gradient.addColorStop(1.00, 'rgba(255, 32, 24, 0)');
            }

            layerCtx.fillStyle = gradient;
            layerCtx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
          }
        }
        layerCtx.restore();
      }

      hexToRgb(hex) {
        const value = hex.replace('#', '');
        return {
          r: parseInt(value.slice(0, 2), 16),
          g: parseInt(value.slice(2, 4), 16),
          b: parseInt(value.slice(4, 6), 16)
        };
      }

      hexToRgba(hex, alpha) {
        const { r, g, b } = this.hexToRgb(hex);
        return `rgba(${r}, ${g}, ${b}, ${Math.max(0, Math.min(1, alpha))})`;
      }

      createLayerCanvas() {
        const layer = document.createElement('canvas');
        layer.width = this.canvas.width;
        layer.height = this.canvas.height;
        return layer;
      }

      getActiveTheme(options) {
        return options?.showTraffic ? TRAFFIC_THEME : TECH_THEME;
      }

      drawBaseMapToContext(targetCtx, theme) {
        for (let r = 0; r < this.maze.length; r++) {
          for (let c = 0; c < this.maze[0].length; c++) {
            let cell = this.maze[r][c];
            let x = c * this.cellSize;
            let y = r * this.cellSize + this.headerHeight;

            if (cell === 'S') targetCtx.fillStyle = theme.start;
            else if (cell === 'E') targetCtx.fillStyle = theme.end;
            else if (isWalkable(cell)) targetCtx.fillStyle = theme.floor;
            else targetCtx.fillStyle = theme.wall;

            targetCtx.fillRect(x, y, this.cellSize, this.cellSize);
            targetCtx.strokeStyle = theme.grid;
            targetCtx.lineWidth = 1;
            targetCtx.strokeRect(x, y, this.cellSize, this.cellSize);
          }
        }
      }

      getBaseMapCanvas(options) {
        const themeKey = options?.showTraffic ? 'traffic' : 'classic';
        if (this.baseMapCanvas?.[themeKey]) return this.baseMapCanvas[themeKey];
        if (!this.baseMapCanvas || this.baseMapCanvas instanceof HTMLCanvasElement) this.baseMapCanvas = {};
        const layer = this.createLayerCanvas();
        this.drawBaseMapToContext(layer.getContext('2d'), this.getActiveTheme(options));
        this.baseMapCanvas[themeKey] = layer;
        return layer;
      }

      getFlowLayerKey(options, stats) {
        return [
          options.showTraffic ? 'traffic' : 'off',
          options.colorMode,
          options.visualStyle,
          Math.round(options.intensity * 100),
          options.thickness,
          stats.maxHeat,
          stats.maxEdgeFlow,
          stats.totalVisits,
          stats.totalEdgeFlow,
          stats.hotCells
        ].join('|');
      }

      getFlowLayerCanvas(stats, options) {
        const key = this.getFlowLayerKey(options, stats);
        if (this.flowLayerCache && this.flowLayerKey === key) return this.flowLayerCache;

        const layer = this.createLayerCanvas();
        const layerCtx = layer.getContext('2d');
        if (!options.showTraffic || !stats.maxHeat) {
          this.flowLayerCache = layer;
          this.flowLayerKey = key;
          return layer;
        }

        if (options.visualStyle === 'grid') {
          this.drawGridFlowLayer(layerCtx, stats, options);
        } else {
          this.drawLineFlowLayer(layerCtx, stats, options);
          this.drawNodeBloomLayer(layerCtx, stats, options);
        }

        this.flowLayerCache = layer;
        this.flowLayerKey = key;
        return this.flowLayerCache;
      }

      drawFlowOverlay(stats, options) {
        this.ctx.drawImage(this.getFlowLayerCanvas(stats, options), 0, 0);
      }

      drawCoverageOverlay(options) {
        if (!options.showCoverage) return;
        this.cameras.forEach((cam) => {
          const cx = cam.c * this.cellSize + this.cellSize / 2;
          const cy = cam.r * this.cellSize + this.headerHeight + this.cellSize / 2;
          this.ctx.beginPath();
          this.ctx.moveTo(cx, cy);
          this.ctx.arc(cx, cy, cam.radius, cam.angle - 0.6, cam.angle + 0.6);
          this.ctx.closePath();
          this.ctx.fillStyle = 'rgba(0, 176, 255, 0.10)';
          this.ctx.fill();
          this.ctx.strokeStyle = 'rgba(0, 176, 255, 0.72)';
          this.ctx.lineWidth = 1;
          this.ctx.stroke();
        });
      }

      calculateCoverageRate(stats) {
        if (!stats.totalVisits) {
          this.coverageRateCache = 0;
          return 0;
        }
        if (this.coverageRateCache !== null) return this.coverageRateCache;
        let coveredVisits = 0;
        for (let r = 0; r < this.maze.length; r++) {
          for (let c = 0; c < this.maze[0].length; c++) {
            const visits = stats.heatMap[r][c];
            if (!visits) continue;
            if (this.isCellCoveredByCameras(r, c).length > 0) coveredVisits += visits;
          }
        }
        this.coverageRateCache = Math.round((coveredVisits / stats.totalVisits) * 100);
        return this.coverageRateCache;
      }

      formatCompactNumber(value) {
        return new Intl.NumberFormat('en-US', {
          notation: value >= 10000 ? 'compact' : 'standard',
          maximumFractionDigits: value >= 10000 ? 1 : 0
        }).format(value);
      }

      renderDistribution(containerId, names, counts, rowClass = '') {
        const container = document.getElementById(containerId);
        if (!container) return;
        const total = counts.reduce((sum, value) => sum + value, 0) || 1;
        container.innerHTML = names.map((name, idx) => {
          const count = counts[idx] || 0;
          const percentage = Math.round((count / total) * 100);
          return `
            <div class="distribution-row ${rowClass}">
              <span title="${name}">${name}</span>
              <div class="distribution-bar"><div class="distribution-fill" style="width:${percentage}%"></div></div>
              <span>${count} / ${percentage}%</span>
            </div>
          `;
        }).join('');
      }

      updateFlowStatsPanel(stats) {
        const totalEl = document.getElementById('flowTotalVisits');
        const peakEl = document.getElementById('flowPeakVisits');
        const hotEl = document.getElementById('flowHotCells');
        const coverageEl = document.getElementById('flowCoverageRate');
        if (!totalEl || !peakEl || !hotEl || !coverageEl) return;

        const coverageRate = this.calculateCoverageRate(stats);
        const panelKey = [
          stats.totalEdgeFlow,
          stats.maxEdgeFlow,
          stats.hotCells,
          coverageRate,
          stats.personalityCounts.join(','),
          stats.algoCounts.join(',')
        ].join('|');
        if (this.statsPanelKey === panelKey) return;
        this.statsPanelKey = panelKey;

        totalEl.innerText = this.formatCompactNumber(stats.totalEdgeFlow || stats.totalVisits);
        peakEl.innerText = this.formatCompactNumber(stats.maxEdgeFlow || stats.maxHeat);
        hotEl.innerText = this.formatCompactNumber(stats.hotCells);
        coverageEl.innerText = `${coverageRate}%`;
        this.renderDistribution('personalityDistribution', PERSONALITY_NAMES, stats.personalityCounts);
        this.renderDistribution('algorithmDistribution', ALGO_NAMES, stats.algoCounts, 'algorithm');
      }

      render(mode) {
        const flowStats = this.buildFullHeatMap();
        const flowOptions = this.getFlowOptions();
        const activeTheme = this.getActiveTheme(flowOptions);
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        // 頂部畫布背景
        this.ctx.fillStyle = activeTheme.header;
        this.ctx.fillRect(0, 0, this.canvas.width, this.headerHeight);
        this.ctx.strokeStyle = activeTheme.headerLine;
        this.ctx.lineWidth = 1;
        this.ctx.beginPath();
        this.ctx.moveTo(0, this.headerHeight - 0.5);
        this.ctx.lineTo(this.canvas.width, this.headerHeight - 0.5);
        this.ctx.stroke();

        // 左側標題
        this.ctx.fillStyle = activeTheme.text;
        this.ctx.font = 'bold 15px Arial';
        this.ctx.textAlign = 'left';
        this.ctx.textBaseline = 'middle';
        this.ctx.fillText(`[Ant Simulation] Steps: ${this.currentStep}`, 15, this.headerHeight / 2);

        // 統計進場狀態數據
        let notEntered = 0, inField = 0, exited = 0;
        let cellMiceCount = {};

        this.micePaths.forEach((path, idx) => {
          let startTick = this.miceDelays[idx];
          if (this.currentStep < startTick) notEntered++;
          else if (this.currentStep < startTick + path.length) {
            inField++;
            let pos = path[this.currentStep - startTick];
            if (!cellMiceCount[pos.toString()]) {
              cellMiceCount[pos.toString()] = { count: 0, color: ALGO_COLORS[this.miceAlgos[idx]] };
            }
            if (cellMiceCount[pos.toString()].count < MAX_ANTS_PER_PIXEL) {
              cellMiceCount[pos.toString()].count++;
              // If multiple ants meet and they have different algorithms, could mix or just keep the first color. Let's keep the first.
            }
          } else exited++;
        });

        // 即時聯動更新網頁 HUD 看板
        document.getElementById('hudNotEntered').innerText = notEntered;
        document.getElementById('hudInField').innerText = inField;
        document.getElementById('hudExited').innerText = exited;

        // 【核心大升級】：精準調用環狀漸層血條儀表板 (置於頂部畫布右上角)
        let totalMice = this.micePaths.length;
        let startX = this.canvas.width - 420;
        if(startX > 250) {
          this.drawHUDProgressRing(startX, 20, 8, 3, notEntered, totalMice, '#00b0ff', '#005af0', 'Not Entered');
          this.drawHUDProgressRing(startX + 140, 20, 8, 3, inField, totalMice, '#ff9100', '#ff4500', 'In Field');
          this.drawHUDProgressRing(startX + 270, 20, 8, 3, exited, totalMice, '#00e676', '#009650', 'Exited');
        }

        // 靜態地圖底圖使用快取，避免每幀重畫完整格線。
        this.ctx.drawImage(this.getBaseMapCanvas(flowOptions), 0, 0);
        this.updateFlowStatsPanel(flowStats);

        // 圖層覆蓋
        if (mode === 'sim') {
          this.drawFlowOverlay(flowStats, flowOptions);
          this.drawCoverageOverlay(flowOptions);
          for (let posStr in cellMiceCount) {
            let [r, c] = posStr.split(',').map(Number);
            let x = c * this.cellSize + this.cellSize / 2;
            let y = r * this.cellSize + this.headerHeight + this.cellSize / 2;
            let count = Math.min(cellMiceCount[posStr].count, MAX_ANTS_PER_PIXEL);
            let color = cellMiceCount[posStr].color;

            this.ctx.beginPath();
            this.ctx.arc(x, y, Math.max(1.5, this.cellSize / 2), 0, Math.PI * 2);
            this.ctx.fillStyle = count === 1 ? color : activeTheme.multi;
            this.ctx.fill();
            if (count === 1) {
              this.ctx.strokeStyle = '#fff';
              this.ctx.lineWidth = 0.5;
              this.ctx.stroke();
            }
            if (count > 1) {
              this.ctx.fillStyle = '#ffffff';
              this.ctx.font = 'bold 22px Arial';
              this.ctx.textAlign = 'center';
              this.ctx.textBaseline = 'middle';
              this.ctx.fillText(String(count), x, y + 1);
            }
          }
        } else if (mode === 'heat') {
          this.drawFlowOverlay(flowStats, flowOptions);
          this.drawCoverageOverlay(flowOptions);

          this.ctx.fillStyle = 'rgba(2, 6, 23, 0.88)';
          this.ctx.fillRect(14, 8, 330, 24);
          this.ctx.fillStyle = '#dbeafe';
          this.ctx.font = 'bold 12px Arial';
          this.ctx.textAlign = 'left';
          this.ctx.textBaseline = 'middle';
          this.ctx.fillText(`完整路徑熱點圖 | 最高 ${flowStats.maxHeat} | 熱點 ${flowStats.hotCells}`, 24, 20);
        } else if (mode === 'camera') {
          this.drawFlowOverlay(flowStats, flowOptions);

          this.cameras.forEach((cam, idx) => {
            let cx = cam.c * this.cellSize + this.cellSize / 2;
            let cy = cam.r * this.cellSize + this.headerHeight + this.cellSize / 2;
            
            if (flowOptions.showCoverage) {
              this.ctx.beginPath();
              this.ctx.moveTo(cx, cy);
              this.ctx.arc(cx, cy, cam.radius, cam.angle - 0.6, cam.angle + 0.6);
              this.ctx.closePath();
              this.ctx.fillStyle = 'rgba(0, 176, 255, 0.14)';
              this.ctx.fill();
              this.ctx.strokeStyle = '#00b0ff';
              this.ctx.lineWidth = 1;
              this.ctx.stroke();
            }

            this.ctx.beginPath();
            this.ctx.arc(cx, cy, Math.max(4, this.cellSize * 0.18), 0, Math.PI * 2);
            this.ctx.fillStyle = '#00b0ff';
            this.ctx.fill();
            this.ctx.strokeStyle = '#ffffff';
            this.ctx.lineWidth = 1.5;
            this.ctx.stroke();

            this.ctx.fillStyle = '#ffffff';
            this.ctx.font = 'bold 12px Arial';
            this.ctx.textAlign = 'center';
            this.ctx.textBaseline = 'middle';
            this.ctx.fillText(String(idx + 1), cx, cy);
          });

          this.ctx.fillStyle = 'rgba(2, 6, 23, 0.88)';
          this.ctx.fillRect(14, 8, 286, 24);
          this.ctx.fillStyle = '#dbeafe';
          this.ctx.font = 'bold 12px Arial';
          this.ctx.textAlign = 'left';
          this.ctx.textBaseline = 'middle';
          this.ctx.fillText(`即時攝影機規劃 | 建議 ${this.cameras.length} 支`, 24, 20);
        }
      }

      start(fps, mode) {
        this.isPlaying = true;
        const interval = 1000 / fps;
        const loop = (timestamp) => {
          if (!this.isPlaying) return;
          if (!this.lastFrameTime) this.lastFrameTime = timestamp;
          if (timestamp - this.lastFrameTime >= interval) {
            this.render(mode);
            this.currentStep++;
            if (this.maxSteps > 0 && this.currentStep >= this.maxSteps) {
              this.currentStep = 0; // 自動循環播放
            }
            this.lastFrameTime = timestamp;
          }
          this.animationId = requestAnimationFrame(loop);
        };
        this.animationId = requestAnimationFrame(loop);
      }

      stop() {
        this.isPlaying = false;
        if (this.animationId) cancelAnimationFrame(this.animationId);
      }
    }

    };

    let simulationSignature = '';
    let activeRunId = 0;
    let activeSimulationController = null;

    function clampAntCount(value) {
      const numeric = parseInt(value, 10);
      if (!Number.isFinite(numeric)) return ANT_COUNT_BASE;
      const rounded = Math.round(numeric / ANT_COUNT_BASE) * ANT_COUNT_BASE;
      return Math.max(ANT_COUNT_BASE, Math.min(ANT_COUNT_MAX, rounded));
    }

    function normalizeAntCountInput() {
      const input = document.getElementById('mouseCount');
      const normalized = clampAntCount(input.value);
      input.value = normalized;
      const readout = document.getElementById('mouseCountValue');
      if (readout) readout.textContent = normalized;
      return normalized;
    }

    function updateAntCountReadout() {
      const input = document.getElementById('mouseCount');
      const readout = document.getElementById('mouseCountValue');
      const normalized = clampAntCount(input.value);
      input.value = normalized;
      if (readout) readout.textContent = normalized;
      return normalized;
    }

    function setSimulationStatus(message, isActive = false) {
      const status = document.getElementById('simulationStatus');
      if (!status) return;
      status.textContent = message || '';
      status.classList.toggle('active', Boolean(message));
      status.setAttribute('aria-busy', isActive ? 'true' : 'false');
    }

    function setSimulationBusy(isBusy, message = '') {
      const button = document.getElementById('btnRun');
      button.disabled = isBusy;
      button.textContent = isBusy ? '正在生成模擬...' : '重新啟動全圖模擬';
      setSimulationStatus(message, isBusy);
    }

    function waitForPaint() {
      return new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    }

    function getSimulationSignature() {
      return [
        mapSelector.value,
        normalizeAntCountInput(),
        document.getElementById('spawnInterval').value,
        document.getElementById('maxCameras').value
      ].join('|');
    }

    function getRenderMode() {
      return document.getElementById('renderMode')?.value || 'sim';
    }

    async function fetchSimulationFrom(endpoint, body, signal) {
      const response = await fetch(`${endpoint}/api/simulate`, {
        method: 'POST',
        mode: 'cors',
        signal,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!response.ok) {
        const message = await response.text();
        throw new Error(`Server simulation failed: ${message}`);
      }
      return response.json();
    }

    async function requestServerSimulation({ mapKey, mouseCount, spawnInterval, maxCameras, signal }) {
      const body = { mapKey, mouseCount, spawnInterval, maxCameras };
      if (/^https?:$/.test(window.location.protocol)) {
        const response = await fetch('/api/simulate', {
          method: 'POST',
          signal,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (!response.ok) {
          const message = await response.text();
          throw new Error(`Server simulation failed: ${message}`);
        }
        return response.json();
      }
      return fetchSimulationFrom(LOCAL_SERVER_URL, body, signal);
    }

    async function prepareSimulation(force = false) {
      const key = mapSelector.value;
      const csvText = mapCsvStore[key]?.trim();
      if (!csvText) {
        alert('目前地圖沒有資料');
        return false;
      }

      const signature = getSimulationSignature();
      const mouseCount = normalizeAntCountInput();
      const spawnInterval = parseInt(document.getElementById('spawnInterval').value);
      const maxCameras = parseInt(document.getElementById('maxCameras').value);

      if (force || signature !== simulationSignature || !sim.maze) {
        if (activeSimulationController) activeSimulationController.abort();
        activeSimulationController = new AbortController();
        try {
          const payload = await requestServerSimulation({
            mapKey: key,
            mouseCount,
            spawnInterval,
            maxCameras,
            signal: activeSimulationController.signal
          });
          sim.loadSimulationPayload(payload);
          console.info('[ITAOI2026] server-side simulation loaded', payload.generatedAt);
        } catch (error) {
          if (error.name === 'AbortError') return false;
          if (mouseCount > LOCAL_SIMULATION_LIMIT) {
            console.warn('[ITAOI2026] server-side simulation unavailable; local fallback skipped for large ANT_COUNT', error);
            setSimulationStatus(`本機 server 未回應，已停止在瀏覽器本地生成 ${mouseCount} 隻螞蟻，避免頁面卡死。請先啟動 start_server.bat 或使用 http://127.0.0.1:8787/itaoi2026.html。`);
            return false;
          }
          console.warn('[ITAOI2026] server unavailable; using small local fallback', error);
          sim.maze = parseCsvMap(csvText);
          await waitForPaint();
          sim.initSimulation(mouseCount, spawnInterval, maxCameras);
        }
        simulationSignature = signature;
      }

      return true;
    }

    async function run(options = {}) {
      const runId = ++activeRunId;
      sim.stop();
      const requestedAntCount = normalizeAntCountInput();
      setSimulationBusy(true, `正在用 server 生成 ${requestedAntCount} 隻螞蟻路徑，地圖尺寸維持原本比例...`);
      await waitForPaint();
      const ready = await prepareSimulation(Boolean(options.force));
      if (runId !== activeRunId) return;
      if (!ready) {
        const currentStatus = document.getElementById('simulationStatus')?.textContent || '';
        setSimulationBusy(false, currentStatus);
        return;
      }

      const fps = parseInt(document.getElementById('animFps').value);
      const mode = getRenderMode();
      const canvasEl = document.getElementById('mazeCanvas');
      canvasEl.style.display = 'block';
      setSimulationStatus('模擬資料已生成，正在更新畫面...', true);
      await waitForPaint();

      if (mode === 'sim') {
        if (sim.currentStep >= sim.maxSteps) sim.currentStep = 0;
        sim.start(fps, mode);
      } else {
        sim.render(mode);
      }
      setPlaybackButtonLabel();
      setSimulationBusy(false, `完成：ANT_COUNT = ${requestedAntCount}`);
    }

    function getCellLabel(cell) {
      if (cell === 'S') return '入口';
      if (cell === 'E') return '出口';
      if (!isNaN(parseInt(cell))) return `展點 ${cell}`;
      if (isWalkable(cell)) return '通道';
      return '牆壁';
    }

    function renderCurrentFrame() {
      if (!sim.maze) return;
      const mode = getRenderMode();
      if (sim.isPlaying && mode === 'sim') return;
      sim.render(mode);
    }

    function getTimelineJumpSteps() {
      const fps = parseInt(document.getElementById('animFps').value, 10) || 20;
      return fps * 10;
    }

    function renderTimelineFrame() {
      if (!sim.maze) return;
      const mode = getRenderMode();
      sim.render(mode);
    }

    function setPlaybackButtonLabel() {
      const button = document.getElementById('btnStop');
      if (!button) return;
      button.textContent = sim.isPlaying ? '暫停' : '繼續';
    }

    function jumpTimeline(direction) {
      if (!sim.maze || !sim.maxSteps) return;
      sim.stop();
      const delta = getTimelineJumpSteps() * direction;
      const maxStep = Math.max(0, sim.maxSteps - 1);
      sim.currentStep = Math.max(0, Math.min(maxStep, sim.currentStep + delta));
      renderTimelineFrame();
      setPlaybackButtonLabel();
      setSimulationStatus(`已跳到 Step ${sim.currentStep} / ${maxStep}`);
    }

    function toggleTimelinePlayback() {
      if (!sim.maze) return;
      const mode = getRenderMode();
      if (sim.isPlaying) {
        sim.stop();
        renderTimelineFrame();
        setPlaybackButtonLabel();
        setSimulationStatus(`已暫停在 Step ${sim.currentStep}`);
        return;
      }
      if (mode !== 'sim') {
        sim.render(mode);
        setPlaybackButtonLabel();
        setSimulationStatus('目前不是 Simulation 模式，切到螞蟻實體監控後可繼續播放。');
        return;
      }
      if (sim.currentStep >= sim.maxSteps) sim.currentStep = 0;
      const fps = parseInt(document.getElementById('animFps').value, 10) || 20;
      sim.start(fps, mode);
      setPlaybackButtonLabel();
      setSimulationStatus(`已從 Step ${sim.currentStep} 繼續播放`);
    }

    let flowRenderTimer = null;
    function scheduleRenderCurrentFrame(delay = 160) {
      if (!sim.maze) return;
      window.clearTimeout(flowRenderTimer);
      setSimulationStatus('正在更新流量圖層...', true);
      flowRenderTimer = window.setTimeout(() => {
        flowRenderTimer = null;
        requestAnimationFrame(() => {
          renderCurrentFrame();
          setSimulationStatus('');
        });
      }, delay);
    }

    function updateFlowTooltip(event) {
      const tooltip = document.getElementById('flowTooltip');
      const options = sim.getFlowOptions();
      if (!options.showTooltip || !sim.maze) {
        tooltip.style.display = 'none';
        return;
      }

      const rect = canvas.getBoundingClientRect();
      const x = (event.clientX - rect.left) * (canvas.width / rect.width);
      const y = (event.clientY - rect.top) * (canvas.height / rect.height);
      const c = Math.floor(x / sim.cellSize);
      const r = Math.floor((y - sim.headerHeight) / sim.cellSize);

      if (r < 0 || c < 0 || r >= sim.maze.length || c >= sim.maze[0].length) {
        tooltip.style.display = 'none';
        return;
      }

      const stats = sim.buildFullHeatMap();
      const visits = stats.heatMap[r][c] || 0;
      const heatRatio = stats.maxHeat ? Math.round((visits / stats.maxHeat) * 100) : 0;
      const algoIndex = sim.getDominantAlgo(stats.algoMap[r][c]);
      const personalityIndex = sim.getDominantAlgo(stats.personalityMap[r][c]);
      const nearbyEdges = stats.cellEdges?.get(`${r},${c}`) || [];
      const peakEdge = nearbyEdges.reduce((best, edge) => edge.count > (best?.count || 0) ? edge : best, null);
      const edgeRatio = peakEdge && stats.maxEdgeFlow ? Math.round((peakEdge.count / stats.maxEdgeFlow) * 100) : 0;
      const edgeAlgoIndex = peakEdge ? sim.getDominantAlgo(peakEdge.algoCounts) : 0;
      const coveredBy = sim.isCellCoveredByCameras(r, c);
      const cell = sim.maze[r][c];
      const coverageText = coveredBy.length ? `#${coveredBy.slice(0, 6).join(', #')}` : '未覆蓋';

      tooltip.innerHTML = `
        <strong>流量監控</strong>
        <div><span class="muted">座標</span> R${r} C${c}</div>
        <div><span class="muted">格子</span> ${getCellLabel(cell)}</div>
        <div><span class="muted">通過次數</span> ${visits}</div>
        <div><span class="muted">相對熱度</span> ${heatRatio}%</div>
        <div><span class="muted">路段流量</span> ${peakEdge ? `${peakEdge.count} / ${edgeRatio}%` : '-'}</div>
        <div><span class="muted">主要人格</span> ${visits ? PERSONALITY_NAMES[personalityIndex] : '-'}</div>
        <div><span class="muted">主要演算法</span> ${peakEdge ? ALGO_NAMES[edgeAlgoIndex] : (visits ? ALGO_NAMES[algoIndex] : '-')}</div>
        <div><span class="muted">攝影機覆蓋</span> ${coverageText}</div>
      `;

      const containerRect = document.getElementById('canvasContainer').getBoundingClientRect();
      let left = event.clientX - containerRect.left + 14;
      let top = event.clientY - containerRect.top + 14;
      tooltip.style.display = 'block';

      const maxLeft = containerRect.width - tooltip.offsetWidth - 12;
      const maxTop = containerRect.height - tooltip.offsetHeight - 12;
      tooltip.style.left = `${Math.max(12, Math.min(left, maxLeft))}px`;
      tooltip.style.top = `${Math.max(12, Math.min(top, maxTop))}px`;
    }

    function hideFlowTooltip() {
      document.getElementById('flowTooltip').style.display = 'none';
    }

    mapSelector.addEventListener('change', () => run({ force: true }));
    document.getElementById('btnRun').addEventListener('click', () => run({ force: true }));
    document.getElementById('btnBack10').addEventListener('click', () => jumpTimeline(-1));
    document.getElementById('btnStop').addEventListener('click', toggleTimelinePlayback);
    document.getElementById('btnForward10').addEventListener('click', () => jumpTimeline(1));
    document.getElementById('mouseCount').addEventListener('input', updateAntCountReadout);
    document.getElementById('mouseCount').addEventListener('change', () => {
      const normalized = updateAntCountReadout();
      setSimulationStatus(`ANT_COUNT 已調整為 ${normalized}，按「重新啟動全圖模擬」後套用。`);
    });

    document.getElementById('animFps').addEventListener('input', (e) => {
      document.getElementById('fpsVal').innerText = e.target.value;
      if (sim.isPlaying) {
        const mode = getRenderMode();
        if (mode === 'sim') {
          sim.stop();
          sim.start(parseInt(e.target.value), mode);
          setPlaybackButtonLabel();
        }
      }
    });

    canvas.addEventListener('mousemove', updateFlowTooltip);
    canvas.addEventListener('mouseleave', hideFlowTooltip);
    ['flowIntensity', 'flowThickness'].forEach((id) => {
      document.getElementById(id).addEventListener('input', () => scheduleRenderCurrentFrame(220));
      document.getElementById(id).addEventListener('change', () => scheduleRenderCurrentFrame(40));
    });
    ['flowColorMode', 'flowVisualStyle', 'showTrafficOverlay', 'showCameraCoverage'].forEach((id) => {
      document.getElementById(id).addEventListener('change', () => scheduleRenderCurrentFrame(80));
    });
    document.getElementById('showFlowTooltip').addEventListener('change', () => {
      if (!document.getElementById('showFlowTooltip').checked) hideFlowTooltip();
    });

    window.onload = () => {
      updateAntCountReadout();
      run();
    };
  
  </script>
</body>
</html>
