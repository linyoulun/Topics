<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Mice Simulation Dashboard</title>

  <style>
    
      body {
      margin: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #05070f;
      color: #e2e8f0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #app { display: flex; width: 100%; height: 100%; }
    .sidebar {
      width: 320px; background-color: #0b0d17; padding: 25px;
      display: flex; flex-direction: column; gap: 18px; overflow-y: auto;
      border-right: 1px solid #1e293b; box-shadow: 5px 0 15px rgba(0,0,0,0.8);
    }
    h2 { margin-top: 0; color: #00f0ff; font-size: 18px; border-bottom: 2px solid #00f0ff; padding-bottom: 10px; font-weight: bold; }
    hr { border: 0; border-top: 1px solid #1e293b; margin: 5px 0; }
    .param-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 12px; color: #94a3b8; font-weight: 600; }
    input[type="number"], select {
      background: #1e293b; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 6px; font-weight: 500;
    }
    textarea {
      background: #0f172a; border: 1px solid #334155; color: #e2e8f0; padding: 10px; border-radius: 6px;
      min-height: 160px; resize: vertical; font-size: 12px; line-height: 1.35; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    button {
      background: linear-gradient(135deg, #00f0ff 0%, #0072ff 100%); color: #fff; border: none; padding: 14px;
      border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(0, 240, 255, 0.3);
    }
    button:hover { filter: brightness(1.1); }
    .hud-panel { background-color: #05060b; border: 1px solid #1e293b; padding: 15px; border-radius: 8px; margin-top: auto; }
    .status-item { margin: 10px 0; font-size: 13px; display: flex; align-items: center; color: #cbd5e1; }
    .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; display: inline-block; }
    .text-blue { background-color: #00b0ff; box-shadow: 0 0 8px #00b0ff; }
    .text-orange { background-color: #ff9100; box-shadow: 0 0 8px #ff9100; }
    .text-green { background-color: #00e676; box-shadow: 0 0 8px #00e676; }

    .main-content {
      flex: 1; background-color: #020305; padding: 20px;
      display: flex; align-items: center; justify-content: center; overflow: auto;
    }
    #canvasContainer {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background-color: #000; border-radius: 6px; border: 1px solid #1e293b;
      overflow: hidden; /* no scroll, just scale */
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  
  </style>

  
</head><body>
  <div id="app">
    <div class="sidebar">
      <h2>⚡ 螞蟻模擬人留</h2>
      <a href="itaoi2026.html" style="color: #00f0ff; text-decoration: none; font-size: 14px; margin-top: -10px; display: inline-block;">🔗 新版: itaoi2026 (僅仔細型)</a>
      <div class="param-group">
        <label>地圖選擇：</label>
        <select id="mapSelector">
          <option value="map1">floor_plan_ascii</option>
          <option value="map2">4F</option>
          <option value="map3">3F</option>
          <option value="map4">1F</option>
        </select>
      </div>
      
      <hr>
      <div class="param-group">
        <label>老鼠總數量 (MOUSE_COUNT):</label>
        <input type="number" id="mouseCount" value="735" min="1" max="1500">
      </div>
      <div class="param-group">
        <label>動畫速度 (FPS):</label>
        <input type="range" id="animFps" min="5" max="60" value="20">
        <span id="fpsVal">20</span>
      </div>
      <div class="param-group">
        <label>進場碰撞間隔 (ticks):</label>
        <input type="number" id="spawnInterval" value="3" min="1">
      </div>
      <div class="param-group">
        <label>建議攝影機最大數量:</label>
        <input type="number" id="maxCameras" value="6" min="1" max="40">
      </div>
      <div class="param-group">
        <label>顯示模式：</label>
        <select id="renderMode">
          <option value="sim">老鼠實體監控 (Simulation)</option>
          <option value="heat">機率熱力圖 (Probability Heatmap)</option>
          <option value="camera">雷達佈點規劃 (Radar Plan)</option>
        </select>
      </div>
      <button id="btnRun">🚀 重制啟動全圖模擬</button>

      <div class="hud-panel">
        <h3>📊 側邊監控看板</h3>
        <div class="status-item"><span class="dot text-blue"></span> Not Entered: <b id="hudNotEntered">0</b></div>
        <div class="status-item"><span class="dot text-orange"></span> In Field: <b id="hudInField">0</b></div>
        <div class="status-item"><span class="dot text-green"></span> Exited: <b id="hudExited">0</b></div>
      </div>
    </div>

    <div class="main-content">
      <div id="canvasContainer">
        <canvas id="mazeCanvas"></canvas>
      </div>
    </div>
  </div>

  <script src="javascript.javascript"></script>
</body>
</html>


  <script>
        const CELL_SIZE = 50;
    const HEADER_HEIGHT = 40;
    const MAX_ANTS_PER_PIXEL = 3;

    
    const ALGO_COLORS = [
      '#0078D7', // 0: BFS (Blue)
      '#FF8C00', // 1: DFS (Orange)
      '#32CD32', // 2: Tremaux (Green)
      '#008080', // 3: AStar (Teal)
      '#8B4513', // 4: Dijkstra (Brown)
      '#9400D3', // 5: GreedyBFS (Purple)
      '#FF1493'  // 6: RandomWalk (Pink)
    ];

    const TECH_THEME = {
      wall: '#323232',
      floor: '#f0f0f0',
      start: '#00c800',
      end: '#c80000',
      ant: '#ffa500',
      multi: '#1e1e1e',
      text: '#000000',
      grid: '#c8c8c8'
    };

    function parseCsvMap(text) {
      const rows = [];
      let maxCols = 0;
      const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
      for (const line of lines) {
        if (!line.trim()) continue;
        const row = line.split(',').map((cell) => {
          const cleaned = String(cell).trim();
          return cleaned === '' ? '#' : cleaned;
        });
        maxCols = Math.max(maxCols, row.length);
        rows.push(row);
      }
      for (const row of rows) {
        while (row.length < maxCols) row.push('#');
      }
      return rows;
    }

    // ==========================================
    // 2. 尋路與量子隊列防死結核心
    // ==========================================
    function isWalkable(cell) {
      if (cell === undefined || cell === null) return false;
      const value = String(cell).trim();
      if (value === '.' || value === 'S' || value === 'E') return true;
      if (!isNaN(parseInt(value))) return true;
      return false;
    }

    function getNeighbors(r, c, maze) {
      const neighbors = [];
      const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (let [dr, dc] of dirs) {
        let nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < maze.length && nc >= 0 && nc < maze[0].length && isWalkable(maze[nr][nc])) {
          neighbors.push([nr, nc]);
        }
      }
      return neighbors;
    }

    function solveBFS(maze, start, end) {
      let queue = [start];
      let visited = new Set([start.toString()]);
      let parent = {};
      parent[start.toString()] = null;

      while (queue.length > 0) {
        let curr = queue.shift();
        if (curr[0] === end[0] && curr[1] === end[1]) {
          let path = [];
          let step = curr;
          while (step) { path.push(step); step = parent[step.toString()]; }
          return path.reverse();
        }
        for (let neighbor of getNeighbors(curr[0], curr[1], maze)) {
          if (!visited.has(neighbor.toString())) {
            visited.add(neighbor.toString());
            parent[neighbor.toString()] = curr;
            queue.push(neighbor);
          }
        }
      }
      return [];
    }

function solveDFS(maze, start, end) {
      let stack = [start];
      let visited = new Set([start.toString()]);
      let parent = {};
      parent[start.toString()] = null;

      while (stack.length > 0) {
        let curr = stack.pop();
        if (curr[0] === end[0] && curr[1] === end[1]) {
          let path = [];
          let step = curr;
          while (step) { path.push(step); step = parent[step.toString()]; }
          return path.reverse();
        }
        let neighbors = getNeighbors(curr[0], curr[1], maze);
        neighbors.sort(() => Math.random() - 0.5);
        for (let neighbor of neighbors) {
          if (!visited.has(neighbor.toString())) {
            visited.add(neighbor.toString());
            parent[neighbor.toString()] = curr;
            stack.push(neighbor);
          }
        }
      }
      return [];
    }

    function heuristic(a, b) {
      return Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]);
    }

    function solveTremaux(maze, start, end) {
      let curr = start;
      let path = [start];
      let visitedEdges = {};
      let searchSteps = 0;
      let maxSteps = maze.length * maze[0].length * 2;
      
      while ((curr[0] !== end[0] || curr[1] !== end[1]) && searchSteps < maxSteps) {
        searchSteps++;
        let neighbors = getNeighbors(curr[0], curr[1], maze);
        let validNeighbors = [];
        
        for (let n of neighbors) {
          let edgeKey = [curr.toString(), n.toString()].sort().join('-');
          if ((visitedEdges[edgeKey] || 0) < 2) {
            validNeighbors.push(n);
          }
        }
        
        if (validNeighbors.length === 0) break;
        let nextNode = validNeighbors[Math.floor(Math.random() * validNeighbors.length)];
        let edgeKey = [curr.toString(), nextNode.toString()].sort().join('-');
        visitedEdges[edgeKey] = (visitedEdges[edgeKey] || 0) + 1;
        
        curr = nextNode;
        path.push(curr);
      }
      return path;
    }

    function solveAStar(maze, start, end) {
      let pq = [{cost: heuristic(start, end), steps: 0, curr: start, path: [start]}];
      let visited = {};
      visited[start.toString()] = 0;
      
      while (pq.length > 0) {
        pq.sort((a, b) => a.cost - b.cost);
        let node = pq.shift();
        
        if (node.curr[0] === end[0] && node.curr[1] === end[1]) return node.path;
        
        let neighbors = getNeighbors(node.curr[0], node.curr[1], maze);
        for (let n of neighbors) {
          let newSteps = node.steps + 1;
          if (visited[n.toString()] === undefined || newSteps < visited[n.toString()]) {
            visited[n.toString()] = newSteps;
            let h = heuristic(n, end);
            pq.push({
              cost: newSteps + h,
              steps: newSteps,
              curr: n,
              path: node.path.concat([n])
            });
          }
        }
      }
      return [];
    }

    function solveDijkstra(maze, start, end) {
      let pq = [{dist: 0, curr: start, path: [start]}];
      let visited = {};
      visited[start.toString()] = 0;
      
      while (pq.length > 0) {
        pq.sort((a, b) => a.dist - b.dist);
        let node = pq.shift();
        
        if (node.curr[0] === end[0] && node.curr[1] === end[1]) return node.path;
        
        let neighbors = getNeighbors(node.curr[0], node.curr[1], maze);
        for (let n of neighbors) {
          let newDist = node.dist + 1;
          if (visited[n.toString()] === undefined || newDist < visited[n.toString()]) {
            visited[n.toString()] = newDist;
            pq.push({
              dist: newDist,
              curr: n,
              path: node.path.concat([n])
            });
          }
        }
      }
      return [];
    }

    function solveGreedyBFS(maze, start, end) {
      let curr = start;
      let path = [start];
      let visited = new Set([start.toString()]);
      let searchSteps = 0;
      let maxSteps = maze.length * maze[0].length;
      
      while ((curr[0] !== end[0] || curr[1] !== end[1]) && searchSteps < maxSteps) {
        searchSteps++;
        let neighbors = getNeighbors(curr[0], curr[1], maze);
        let bestNode = null;
        let minH = Infinity;
        
        for (let n of neighbors) {
          if (!visited.has(n.toString())) {
            let h = heuristic(n, end);
            if (h < minH) {
              minH = h;
              bestNode = n;
            }
          }
        }
        
        if (bestNode) {
          curr = bestNode;
          visited.add(curr.toString());
          path.push(curr);
        } else {
          break;
        }
      }
      return path;
    }

    function solveRandomWalk(maze, start, target) {
      let path = [start];
      let curr = start;
      let visitedCount = {};
      visitedCount[start.toString()] = 1;
      let maxSteps = 1000;
      let step = 0;
      
      while (step < maxSteps) {
        if (curr[0] === target[0] && curr[1] === target[1]) {
          break;
        }
        let neighbors = getNeighbors(curr[0], curr[1], maze);
        if (neighbors.length === 0) break;
        
        let nextNode = null;
        if (Math.random() < 0.2) {
          // 20% bias to move towards the target
          let bestDist = Infinity;
          for (let n of neighbors) {
            let dist = Math.abs(n[0] - target[0]) + Math.abs(n[1] - target[1]);
            if (dist < bestDist) {
              bestDist = dist;
              nextNode = n;
            }
          }
        } else {
          // 80% chance to explore, preferring less visited nodes
          let minCount = Infinity;
          for (let n of neighbors) {
            let c = visitedCount[n.toString()] || 0;
            if (c < minCount) { minCount = c; }
          }
          let candidates = neighbors.filter(n => (visitedCount[n.toString()] || 0) === minCount);
          nextNode = candidates[Math.floor(Math.random() * candidates.length)];
        }
        
        path.push(nextNode);
        visitedCount[nextNode.toString()] = (visitedCount[nextNode.toString()] || 0) + 1;
        curr = nextNode;
        step++;
      }
      return path;
    }

    // ==========================================
    // 3. Canvas 繪圖引擎與環狀進度儀表板
    // ==========================================
    class Simulator {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.maze = null;
        this.cellSize = CELL_SIZE;
        this.headerHeight = HEADER_HEIGHT;
        this.micePaths = [];
        this.miceAlgos = [];
        this.miceDelays = [];
        this.maxSteps = 0;
        this.currentStep = 0;
        this.isPlaying = false;
        this.animationId = null;
        this.lastFrameTime = 0;
        this.cameras = [];
      }

      initSimulation(mouseCount, spawnInterval, maxCameras) {
        if (!this.maze) return;
        this.currentStep = 0;
        this.micePaths = [];
        this.miceAlgos = [];
        this.miceDelays = [];
        this.maxSteps = 0;
        this.cellSize = CELL_SIZE;
        this.headerHeight = HEADER_HEIGHT;

        let starts = [], ends = [], exhibits = [];
        for (let r = 0; r < this.maze.length; r++) {
          for (let c = 0; c < this.maze[0].length; c++) {
            let cell = this.maze[r][c];
            if (cell === 'S') starts.push([r, c]);
            else if (cell === 'E') ends.push([r, c]);
            else if (cell === '1' || cell === '2') exhibits.push([r, c]);
          }
        }

        // 尋路軌跡分配
        let rawPaths = [];
        let rawAlgos = [];
        for (let i = 0; i < mouseCount; i++) {
          let start = starts[Math.floor(Math.random() * Math.max(1, starts.length))];
          let end = ends[Math.floor(Math.random() * Math.max(1, ends.length))];
          
          let personality = ["Careful", "Opportunist", "Random"][Math.floor(Math.random() * 3)];
          let targets = [];
          
          if (personality === "Careful") {
            let sortedEx = [...exhibits].sort((a, b) => {
              let valA = parseInt(this.maze[a[0]][a[1]]) || 999;
              let valB = parseInt(this.maze[b[0]][b[1]]) || 999;
              return valA - valB;
            });
            targets = sortedEx.concat([end]);
          } else if (personality === "Opportunist") {
            let remaining = [...exhibits];
            let curr = start;
            while(remaining.length > 0) {
              let bestIdx = 0;
              let bestDist = Infinity;
              for(let j=0; j<remaining.length; j++) {
                let d = Math.abs(curr[0]-remaining[j][0]) + Math.abs(curr[1]-remaining[j][1]);
                if (d < bestDist) { bestDist = d; bestIdx = j; }
              }
              let nextTarget = remaining.splice(bestIdx, 1)[0];
              targets.push(nextTarget);
              curr = nextTarget;
            }
            targets.push(end);
          } else {
            let remaining = [...exhibits];
            let curr = start;
            while(remaining.length > 0) {
              remaining.sort((a, b) => {
                let dA = Math.abs(curr[0]-a[0]) + Math.abs(curr[1]-a[1]);
                let dB = Math.abs(curr[0]-b[0]) + Math.abs(curr[1]-b[1]);
                return dA - dB;
              });
              let candidates = remaining.slice(0, 3);
              let nextTarget = candidates[Math.floor(Math.random() * candidates.length)];
              targets.push(nextTarget);
              remaining = remaining.filter(ex => ex[0] !== nextTarget[0] || ex[1] !== nextTarget[1]);
              curr = nextTarget;
            }
            targets.push(end);
          }
          
          
          let algos = [solveBFS, solveDFS, solveTremaux, solveAStar, solveDijkstra, solveGreedyBFS, solveRandomWalk];
          let algoChoice = Math.floor(Math.random() * algos.length);
          rawAlgos.push(algoChoice);
          let fullPath = [start];
          let currPos = start;
          
          for (let target of targets) {
            if (!target) continue;
            let subPath = algos[algoChoice](this.maze, currPos, target);
if (subPath && subPath.length > 0) {
              if (subPath[0][0] === currPos[0] && subPath[0][1] === currPos[1]) {
                fullPath = fullPath.concat(subPath.slice(1));
              } else {
                fullPath = fullPath.concat(subPath);
              }
            }
            currPos = target;
          }
          
          rawPaths.push(fullPath.length > 1 ? fullPath : [start, end]);
        }

        // CSMA/CD 佇列進場延遲計算
        for (let i = 0; i < mouseCount; i++) {
          this.micePaths.push(rawPaths[i]);
          this.miceAlgos.push(rawAlgos[i]);
          let delay = i * spawnInterval + 15;
          this.miceDelays.push(delay);
          let totalLen = delay + rawPaths[i].length;
          if (totalLen > this.maxSteps) this.maxSteps = totalLen;
        }
        // 加入緩衝時間，等最後一隻螞蟻抵達後 50 個 step 再重新開始
        this.maxSteps += 50;


        this.calculateCameraPlacement(maxCameras);
        this.canvas.width = this.maze[0].length * this.cellSize;
        this.canvas.height = this.maze.length * this.cellSize + this.headerHeight;
      }

      calculateCameraPlacement(maxCameras) {
        this.cameras = [];
        let heatMap = Array(this.maze.length).fill(0).map(() => Array(this.maze[0].length).fill(0));
        this.micePaths.forEach(path => path.forEach(([r, c]) => { heatMap[r][c]++; }));

        let wallCandidates = [];
        for (let r = 0; r < this.maze.length; r++) {
          for (let c = 0; c < this.maze[0].length; c++) {
            if (!isWalkable(this.maze[r][c])) wallCandidates.push([r, c]);
          }
        }

        let step = Math.max(1, Math.floor(wallCandidates.length / 800));
        for (let k = 0; k < maxCameras; k++) {
          let bestScore = -1, bestCam = null;
          for (let i = 0; i < wallCandidates.length; i += step) {
            let [wr, wc] = wallCandidates[i];
            if (this.cameras.some(c => c.r === wr && c.c === wc)) continue;
            
            let score = 0;
            for (let dr = -5; dr <= 5; dr++) {
              for (let dc = -5; dc <= 5; dc++) {
                let nr = wr + dr, nc = wc + dc;
                if (nr >= 0 && nr < this.maze.length && nc >= 0 && nc < this.maze[0].length) {
                  if (isWalkable(this.maze[nr][nc])) score += heatMap[nr][nc];
                }
              }
            }
            if (score > bestScore) {
              bestScore = score;
              bestCam = { r: wr, c: wc, radius: this.cellSize * 12, angle: Math.random() * Math.PI * 2 };
            }
          }
          if (bestCam && bestScore > 0) this.cameras.push(bestCam);
        }
      }

      // 完美重置：繪製右上角高精準環狀進度儀表板
      drawHUDProgressRing(cx, cy, radius, thickness, value, total, startColor, endColor, label) {
        // 1. 繪製底部灰色槽
        this.ctx.beginPath();
        this.ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        this.ctx.strokeStyle = '#e6e6e6';
        this.ctx.lineWidth = thickness;
        this.ctx.stroke();

        // 2. 繪製漸層彩色進度弧線
        if (total > 0 && value > 0) {
          let percentage = value / total;
          this.ctx.beginPath();
          this.ctx.arc(cx, cy, radius, -Math.PI / 2, (-Math.PI / 2) + (Math.PI * 2 * percentage));
          this.ctx.strokeStyle = startColor;
          this.ctx.lineWidth = thickness;
          this.ctx.stroke();
        }

        // 3. 填入精緻數值與標籤文字 (對齊 Python 格式)
        this.ctx.fillStyle = '#3c3c3c';
        this.ctx.font = 'bold 11px Arial';
        this.ctx.textAlign = 'left';
        this.ctx.textBaseline = 'middle';
        let valStr = String(value).padStart(3, '0');
        this.ctx.fillText(`${label} ${valStr}`, cx + radius + 8, cy);
      }

      render(mode) {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        // 頂部畫布背景
        this.ctx.fillStyle = '#ffffff';
        this.ctx.fillRect(0, 0, this.canvas.width, this.headerHeight);

        // 左側標題
        this.ctx.fillStyle = TECH_THEME.text;
        this.ctx.font = 'bold 15px Arial';
        this.ctx.textAlign = 'left';
        this.ctx.textBaseline = 'middle';
        this.ctx.fillText(`[All Mice Simulation] Steps: ${this.currentStep}`, 15, this.headerHeight / 2);

        // 統計進場狀態數據
        let notEntered = 0, inField = 0, exited = 0;
        let cellMiceCount = {};

        this.micePaths.forEach((path, idx) => {
          let startTick = this.miceDelays[idx];
          if (this.currentStep < startTick) notEntered++;
          else if (this.currentStep < startTick + path.length) {
            inField++;
            let pos = path[this.currentStep - startTick];
            if (!cellMiceCount[pos.toString()]) {
              cellMiceCount[pos.toString()] = { count: 0, color: ALGO_COLORS[this.miceAlgos[idx]] };
            }
            if (cellMiceCount[pos.toString()].count < MAX_ANTS_PER_PIXEL) {
              cellMiceCount[pos.toString()].count++;
              // If multiple ants meet and they have different algorithms, could mix or just keep the first color. Let's keep the first.
            }
          } else exited++;
        });

        // 即時聯動更新網頁 HUD 看板
        document.getElementById('hudNotEntered').innerText = notEntered;
        document.getElementById('hudInField').innerText = inField;
        document.getElementById('hudExited').innerText = exited;

        // 【核心大升級】：精準調用環狀漸層血條儀表板 (置於頂部畫布右上角)
        let totalMice = this.micePaths.length;
        let startX = this.canvas.width - 420;
        if(startX > 250) {
          this.drawHUDProgressRing(startX, 20, 8, 3, notEntered, totalMice, '#00b0ff', '#005af0', 'Not Entered');
          this.drawHUDProgressRing(startX + 140, 20, 8, 3, inField, totalMice, '#ff9100', '#ff4500', 'In Field');
          this.drawHUDProgressRing(startX + 270, 20, 8, 3, exited, totalMice, '#00e676', '#009650', 'Exited');
        }

        // 繪製高密度原始大樓迷宮網格矩陣
        for (let r = 0; r < this.maze.length; r++) {
          for (let c = 0; c < this.maze[0].length; c++) {
            let cell = this.maze[r][c];
            let x = c * this.cellSize;
            let y = r * this.cellSize + this.headerHeight;

            if (cell === 'S') this.ctx.fillStyle = TECH_THEME.start;
            else if (cell === 'E') this.ctx.fillStyle = TECH_THEME.end;
            else if (isWalkable(cell)) this.ctx.fillStyle = TECH_THEME.floor;
            else this.ctx.fillStyle = TECH_THEME.wall;

            this.ctx.fillRect(x, y, this.cellSize, this.cellSize);
            this.ctx.strokeStyle = TECH_THEME.grid;
            this.ctx.lineWidth = 1;
            this.ctx.strokeRect(x, y, this.cellSize, this.cellSize);
          }
        }

        // 圖層覆蓋
        if (mode === 'sim') {
          for (let posStr in cellMiceCount) {
            let [r, c] = posStr.split(',').map(Number);
            let x = c * this.cellSize + this.cellSize / 2;
            let y = r * this.cellSize + this.headerHeight + this.cellSize / 2;
            let count = Math.min(cellMiceCount[posStr].count, MAX_ANTS_PER_PIXEL);
            let color = cellMiceCount[posStr].color;

            this.ctx.beginPath();
            this.ctx.arc(x, y, Math.max(1.5, this.cellSize / 2), 0, Math.PI * 2);
            this.ctx.fillStyle = count === 1 ? color : TECH_THEME.multi;
            this.ctx.fill();
            if (count === 1) {
              this.ctx.strokeStyle = '#fff';
              this.ctx.lineWidth = 0.5;
              this.ctx.stroke();
            }
            if (count > 1) {
              this.ctx.fillStyle = '#ffffff';
              this.ctx.font = 'bold 22px Arial';
              this.ctx.textAlign = 'center';
              this.ctx.textBaseline = 'middle';
              this.ctx.fillText(String(count), x, y + 1);
            }
          }
        } else if (mode === 'heat') {
          let currentHeat = Array(this.maze.length).fill(0).map(() => Array(this.maze[0].length).fill(0));
          this.micePaths.forEach((path, idx) => {
            let startTick = this.miceDelays[idx];
            let progress = Math.min(this.currentStep - startTick, path.length - 1);
            if (progress >= 0) {
              for(let s=0; s<=progress; s++) { currentHeat[path[s][0]][path[s][1]]++; }
            }
          });
          for (let r = 0; r < this.maze.length; r++) {
            for (let c = 0; c < this.maze[0].length; c++) {
              if (currentHeat[r][c] > 0) {
                let ratio = Math.min(currentHeat[r][c] / (totalMice * 0.05), 1.0);
                // 經典雷射藍漸層光譜熱力圖層
                this.ctx.fillStyle = `rgba(0, 120, 215, ${0.25 + ratio * 0.7})`;
                this.ctx.fillRect(c * this.cellSize, r * this.cellSize + this.headerHeight, this.cellSize, this.cellSize);
              }
            }
          }
        } else if (mode === 'camera') {
          this.cameras.forEach((cam, idx) => {
            let cx = cam.c * this.cellSize + this.cellSize / 2;
            let cy = cam.r * this.cellSize + this.headerHeight + this.cellSize / 2;
            
            this.ctx.beginPath();
            this.ctx.moveTo(cx, cy);
            this.ctx.arc(cx, cy, cam.radius * 2, cam.angle - 0.6, cam.angle + 0.6);
            this.ctx.closePath();
            this.ctx.fillStyle = 'rgba(0, 90, 220, 0.15)';
            this.ctx.fill();
            this.ctx.strokeStyle = '#005af0';
            this.ctx.lineWidth = 1;
            this.ctx.stroke();

            this.ctx.beginPath();
            this.ctx.arc(cx, cy, 3, 0, Math.PI * 2);
            this.ctx.fillStyle = '#005af0';
            this.ctx.fill();
          });
        }
      }

      start(fps, mode) {
        this.isPlaying = true;
        const interval = 1000 / fps;
        const loop = (timestamp) => {
          if (!this.isPlaying) return;
          if (!this.lastFrameTime) this.lastFrameTime = timestamp;
          if (timestamp - this.lastFrameTime >= interval) {
            this.render(mode);
            this.currentStep++;
            if (this.maxSteps > 0 && this.currentStep >= this.maxSteps) {
              this.currentStep = 0; // 自動循環播放
            }
            this.lastFrameTime = timestamp;
          }
          this.animationId = requestAnimationFrame(loop);
        };
        this.animationId = requestAnimationFrame(loop);
      }

      stop() {
        this.isPlaying = false;
        if (this.animationId) cancelAnimationFrame(this.animationId);
      }
    }

    async function run() {
      sim.stop();
      const key = mapSelector.value;
      const csvText = mapCsvStore[key]?.trim();
      if (!csvText) {
        alert('目前地圖沒有資料');
        return;
      }
      sim.maze = parseCsvMap(csvText);

      const mouseCount = parseInt(document.getElementById('mouseCount').value);
      const fps = parseInt(document.getElementById('animFps').value);
      const spawnInterval = parseInt(document.getElementById('spawnInterval').value);
      const maxCameras = parseInt(document.getElementById('maxCameras').value);
      const mode = document.getElementById('renderMode').value;
      
      sim.initSimulation(mouseCount, spawnInterval, maxCameras);
      sim.start(fps, mode);
    }

    mapSelector.addEventListener('change', run);
        document.getElementById('btnRun').addEventListener('click', run);

    document.getElementById('animFps').addEventListener('input', (e) => {
      document.getElementById('fpsVal').innerText = e.target.value;
      if (sim.isPlaying) {
        const mode = document.getElementById('renderMode').value;
        sim.stop();
        sim.start(parseInt(e.target.value), mode);
      }
    });

    document.getElementById('renderMode').addEventListener('change', (e) => {
      if (sim.isPlaying) {
        const fps = parseInt(document.getElementById('animFps').value);
        sim.stop();
        sim.start(fps, e.target.value);
      }
    });

    window.onload = () => {
      run();
    };
